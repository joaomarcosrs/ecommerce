[project]
name = "ecommerce"
version = "0.1.0"
description = ""
authors = [
    {name = "João Marcos Silva", email = "joaomarcosrs40@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.116.1,<0.117.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "sqlalchemy>=2.0.43,<3.0.0",
    "ulid-py>=1.1.0,<2.0.0",
    "alembic>=1.16.5,<2.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "pwdlib[argon2]>=0.2.1,<0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "taskipy>=1.14.1,<2.0.0",
    "ruff>=0.12.11,<0.13.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev ecommerce/backend/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=ecommerce -vv'
post_test = 'coverage html'
